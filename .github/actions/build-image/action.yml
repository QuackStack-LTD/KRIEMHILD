name: Build KRIEMHILD image
description: Build and test the production image; publishing is opt-in.
inputs:
  push:
    description: Publish to the registry (release workflow only)
    default: 'false'
  tags:
    description: Image tags, one per line
    default: kriemhild:ci
  platforms:
    description: Target platforms
    default: linux/amd64
outputs:
  digest:
    description: Built image digest
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Enable ARM64 runtime build steps
      if: contains(inputs.platforms, 'linux/arm64')
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Build image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ./Dockerfile
        target: runtime
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push == 'true' }}
        load: ${{ inputs.push != 'true' }}
        tags: ${{ inputs.tags }}
        labels: |
          org.opencontainers.image.title=KRIEMHILD
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
