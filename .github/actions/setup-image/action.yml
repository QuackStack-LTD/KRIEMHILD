name: Set up image builds
description: Configure multi-platform Buildx and restore its local build cache.
runs:
  using: composite
  steps:
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/kriemhild-buildx-cache
        key: ${{ runner.os }}-kriemhild-buildx-v2-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-kriemhild-buildx-v2-
    - name: Configure image build cache
      shell: bash
      run: printf 'KRIEMHILD_BUILDX_CACHE=%s/kriemhild-buildx-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
