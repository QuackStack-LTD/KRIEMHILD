name: Build main
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/build-image
        with:
          push: 'false'
          tags: kriemhild:ci
      - name: Check SQLite and PostgreSQL container persistence
        run: bash scripts/container-smoke.sh kriemhild:ci
