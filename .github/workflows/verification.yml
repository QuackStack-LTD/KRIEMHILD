name: KRIEMHILD verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Platform tests (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source and tests
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: npm run setup

      - name: Build Next.js frontend and Go backend
        run: npm run build

      - name: Run storage and API tests, Go vet, and TypeScript checks
        run: npm test

      - name: Check Go concurrency safety
        if: runner.os == 'Linux'
        run: go test -race ./internal/...

      - name: Install Chromium and system dependencies
        working-directory: apps/web
        run: npx --no-install playwright install --with-deps chromium

      - name: Run browser acceptance tests
        run: npm run test:e2e

      - name: Upload browser report, screenshots, and traces
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: kriemhild-browser-results-${{ matrix.os }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
  container:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build self-hosted image
        run: docker build --tag kriemhild:test .
      - name: Verify executable in image
        run: docker run --rm kriemhild:test -help
      - name: Verify hosted container login and persistent world creation
        shell: bash
        run: |
          docker run -d --name kriemhild-smoke -p 127.0.0.1:4784:4784 -e KRIEMHILD_ADMIN_PASSWORD=ci-only-password-12345 kriemhild:test -addr 0.0.0.0:4784 -origin http://127.0.0.1:4784
          trap 'docker logs kriemhild-smoke; docker rm -f kriemhild-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4784/api/v1/session > /tmp/kriemhild-session.json; then break; fi
            sleep 1
          done
          jq -e '.hosted == true and .authenticated == false' /tmp/kriemhild-session.json
          curl --fail --silent -c /tmp/kriemhild-cookies -H 'Origin: http://127.0.0.1:4784' -H 'Content-Type: application/json' -d '{"user":"admin","password":"ci-only-password-12345"}' http://127.0.0.1:4784/api/v1/login
          curl --fail --silent -b /tmp/kriemhild-cookies -H 'Origin: http://127.0.0.1:4784' -H 'Content-Type: application/json' -d '{"name":"Container reference","age":"Founding"}' http://127.0.0.1:4784/api/v1/projects > /tmp/kriemhild-world.json
          jq -e '.root.world.name == "Container reference"' /tmp/kriemhild-world.json
          docker restart kriemhild-smoke
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4784/api/v1/session > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent -c /tmp/kriemhild-cookies -H 'Origin: http://127.0.0.1:4784' -H 'Content-Type: application/json' -d '{"user":"admin","password":"ci-only-password-12345"}' http://127.0.0.1:4784/api/v1/login
          curl --fail --silent -b /tmp/kriemhild-cookies http://127.0.0.1:4784/api/v1/projects | jq -e 'any(.[]; .name == "Container reference")'
  packages:
    name: Local package (${{ matrix.goos }} / ${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: windows, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm run setup
      - run: npm --prefix apps/web run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: kriemhild-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 14
