name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag, for example v1.0.0 or v1.1.0-rc.1'
        required: true
        type: string
permissions:
  contents: write
  packages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate release and registry namespace
        id: release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Version must be a tag such as v1.0.0 or v1.1.0-rc.1' >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo 'This release tag already exists; choose a new version.' >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            printf '%s:%s\n' "$image" "$VERSION"
            if [[ "$VERSION" != *-* ]]; then printf '%s:latest\n' "$image"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build release candidate without publishing
        uses: ./.github/actions/build-image
        with:
          push: 'false'
          tags: kriemhild:release-test
      - name: Verify the release candidate
        run: bash scripts/container-smoke.sh kriemhild:release-test
      - name: Log in to the organization GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Linux images
        id: publish
        uses: ./.github/actions/build-image
        with:
          push: 'true'
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release.outputs.tags }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Container: `%s:%s`\n\nDigest: `%s`\n\nPlatforms: linux/amd64, linux/arm64.\n' "$IMAGE" "$VERSION" "$DIGEST" > release-notes.md
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file release-notes.md --generate-notes "${flags[@]}"
